name: Weekly Model Training

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: energy-data-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  train-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Node.js dependencies
        working-directory: ./backend
        run: npm ci

      - name: Install Python dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create necessary directories
        run: |
          mkdir -p backend/logs
          mkdir -p backend/models

      - name: Pull latest branch before training
        run: git pull --rebase origin main

      - name: Run ensemble model training
        working-directory: ./backend
        run: |
          python src/ml/weekly_workflow_v2.py

      - name: Validate workflow outputs
        working-directory: ./backend
        run: npx tsx src/scripts/validateWorkflowOutputs.ts

      - name: Check for changes
        id: git-check
        run: |
          git add backend/data/energy.db
          git add backend/models/
          git add backend/public/forecasts.json
          git add frontend/public/forecasts.json
          git add backend/logs/*.log || true
          git diff --cached --exit-code || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "chore: weekly forecast cycle [skip ci]"
          git push

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-logs-${{ github.run_number }}
          path: backend/logs/*.log
          retention-days: 30

      - name: Upload ensemble model as artifact
        if: steps.git-check.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ensemble-model-${{ github.run_number }}
          path: |
            backend/models/prophet_model.json
            backend/models/xgboost_residual.joblib
            backend/models/quality_report.json
          retention-days: 90
